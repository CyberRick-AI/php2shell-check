name: Bug report
description: Something in the scanner, report or audit is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security problem in this tool? Use the Security tab > Report a vulnerability instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How you ran it (node server.js / Docker / Worker / local-audit.js), and the response headers if relevant. Don't post a client's site without their OK.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version and OS
