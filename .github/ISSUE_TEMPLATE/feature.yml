name: Feature idea
description: Suggest an improvement (must stay passive)
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: checkboxes
    id: passive
    attributes:
      label: Ground rules
      options:
        - label: This stays passive (no exploit traffic or active probes)
          required: true
